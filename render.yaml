services:
  - type: web
    name: osint-api-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: UPSTREAM_BASE
        value: https://osint-apis-hub.onrender.com
      - key: UPSTREAM_KEY
        value: Demo
