services:
  - type: web
    name: osint-api-hub
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Dashboard ka password. Deploy ke baad badal lena (Environment tab se).
      - key: ADMIN_PASSWORD
        value: admin123
      # Upstream free OSINT source
      - key: UPSTREAM_BASE
        value: https://osint-apis-hub.onrender.com
      - key: UPSTREAM_KEY
        value: Demo
      # Public demo key (log free try kar sakein)
      - key: DEMO_KEY
        value: Demo
      - key: UPSTREAM_BASE
        sync: false            # reference hub ka URL (default osint-apis-hub.onrender.com)
      - key: UPSTREAM_KEY
        sync: false            # us hub ki VALID key (Demo invalid hai) -> GST/PAN live data
      # ---------- v2.6 PERMANENCE (ZAROORI!) ----------
      # Render free plan par DB file har restart/deploy me udd jati hai.
      # Ye 3 env vars lagao -> aapki API key HAMESHA zinda rahegi:
      - key: MASTER_API_KEY
        sync: false            # aapki permanent key (dashboard se banao ya jo bhi ho)
      - key: GITHUB_BACKUP_REPO
        sync: false            # jaise: himanshu74919-cpu/hub-db-backup (PRIVATE repo)
      - key: GITHUB_BACKUP_TOKEN
        sync: false            # us repo ka token (repo scope)
      - key: GITHUB_BACKUP_MINUTES
        value: "15"
      # Branding — har response me dikhega
      - key: BRAND_TAG
        value: "@Supermannn_x"
      # Apna UPI ID yahan daal dein (payment seedha aapko)
      # - key: UPI_ID
      #   value: aapka@okhdfcbank
      # - key: UPI_NAME
      #   value: OSINT API Hub
      # Payment webhook security (optional)
      # - key: WEBHOOK_SECRET
      #   value: koi-bhi-lamba-secret
