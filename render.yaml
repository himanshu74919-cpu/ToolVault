services:
  - type: web
    name: osint-api-hub
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Dashboard ka password — dashboard me jo daala wahi chalega (sync: false)
      # (pehle yahan value: admin123 hardcoded thi -> har deploy par aapka password reset ho jata tha!)
      - key: ADMIN_PASSWORD
        sync: false
      # Upstream OSINT source — dashboard me jo set karoge wahi chalega
      - key: UPSTREAM_BASE
        sync: false            # khali chhodo = https://osint-apis-hub.onrender.com
      - key: UPSTREAM_KEY
        sync: false            # YAHAN APNI VALID KEY DAALO (Demo invalid hai)
      # Public demo key (khali chhodo = Demo)
      - key: DEMO_KEY
        sync: false
      # ---------- APNI API (vehicle) — koi bhi provider style ----------
      - key: VEHICLE_PROVIDER_URL
        sync: false            # provider ka endpoint
      - key: VEHICLE_PROVIDER_KEY
        sync: false            # provider ki key
      - key: VEHICLE_PROVIDER_AUTH
        sync: false            # bearer | key | header | query | rapidapi
      - key: VEHICLE_PROVIDER_HEADERS
        sync: false            # RapidAPI ke liye: X-RapidAPI-Key:{key}|X-RapidAPI-Host:xxx.p.rapidapi.com
      - key: VEHICLE_PROVIDER_METHOD
        sync: false            # GET | POST
      - key: VEHICLE_PROVIDER_BODY
        sync: false            # POST body: {"vehicle_number":"{number}"}
      - key: VEHICLE_PROVIDER_PARAM
        sync: false            # query param ka naam (default: number)
      # ---------- APNI API (number/carrier) — same style ----------
      - key: NUMINFO_PROVIDER_URL
        sync: false
      - key: NUMINFO_PROVIDER_KEY
        sync: false
      - key: NUMINFO_PROVIDER_AUTH
        sync: false
      - key: NUMINFO_PROVIDER_HEADERS
        sync: false
      - key: NUMINFO_PROVIDER_METHOD
        sync: false
      - key: NUMINFO_PROVIDER_BODY
        sync: false
      - key: NUMINFO_PROVIDER_PARAM
        sync: false
      # ---------- v2.6 PERMANENCE (ZAROORI!) ----------
      # Render free plan par DB file har restart/deploy me udd jati hai.
      # Ye 3 env vars lagao -> aapki API key HAMESHA zinda rahegi:
      - key: MASTER_API_KEY
        sync: false            # aapki permanent key (dashboard se banao ya jo bhi ho)
      - key: GITHUB_BACKUP_REPO
        sync: false            # jaise: himanshu74919-cpu/hub-db-backup (PRIVATE repo)
      - key: GITHUB_BACKUP_TOKEN
        sync: false            # us repo ka token (repo scope)
      - key: GITHUB_BACKUP_MINUTES
        value: "15"
      # Branding — har response me dikhega
      - key: BRAND_TAG
        value: "@Supermannn_x"
      # Apna UPI ID yahan daal dein (payment seedha aapko)
      # - key: UPI_ID
      #   value: aapka@okhdfcbank
      # - key: UPI_NAME
      #   value: OSINT API Hub
      # Payment webhook security (optional)
      # - key: WEBHOOK_SECRET
      #   value: koi-bhi-lamba-secret
