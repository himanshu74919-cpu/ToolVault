name: Keep hub awake (free 24/7)

# Render free plan 15 min inactivity ke baad service sula deta hai (50 sec cold start).
# Ye workflow har 10 minute me /health ping karta hai -> hub hamesha jaagta rehta hai.
# GitHub Actions public repo me FREE hai (unlimited minutes).

on:
  schedule:
    - cron: "*/10 * * * *"     # har 10 minute
  workflow_dispatch: {}          # manually bhi chala sakte ho (Actions tab -> Run workflow)

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping hub /health
        run: |
          URL="https://osint-api-hub.onrender.com/health"
          echo "Pinging $URL at $(date -u '+%d-%m-%Y %H:%M UTC')"
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              head -c 400 /tmp/resp.json; echo
              exit 0
            fi
            sleep 20
          done
          echo "ping fail (service soti reh sakti hai) — agli baar phir try hoga"
          exit 0
